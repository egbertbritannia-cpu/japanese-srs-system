name: 🚀 24/7 Google Drive 15TB Streaming Crawler

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bất kỳ lúc nào trên GitHub
    inputs:
      target:
        description: 'Mục tiêu cào (Target Dataset)'
        required: true
        default: 'jlpt_ielts'
        type: choice
        options:
          - 'jlpt_ielts' # 🎧 2 kho dung lượng cực lớn: JLPT Choukai CDs & Cambridge IELTS CDs
          - 'all'        # 🌊 Toàn bộ 6 kho dữ liệu học thuật
          - 'jlpt'       # 🇯🇵 Chỉ đề thi nghe JLPT Choukai CDs
          - 'ielts'      # 🇬🇧 Chỉ đĩa nghe Cambridge IELTS CDs
  schedule:
    - cron: '0 */6 * * *' # Tự động chạy mỗi 6 tiếng một lần trên Cloud ngay cả khi tắt máy tính

jobs:
  stream-to-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Chạy tối đa 6 tiếng mỗi lần (giới hạn miễn phí của GitHub)
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Run Streaming Ingestion into Google Drive 15TB
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          TARGET="${{ github.event.inputs.target || 'jlpt_ielts' }}"
          echo "=================================================================="
          echo "🚀 Bắt đầu streaming dữ liệu thật lên Google Drive 15TB (Target: $TARGET)..."
          echo "=================================================================="
          if [ "$TARGET" = "all" ]; then
            npx tsx scripts/crawlers/orchestrate-6-workers.ts --all
          else
            npx tsx scripts/crawlers/orchestrate-6-workers.ts --target=$TARGET --all
          fi

      - name: 💾 Commit & Push updated manifests
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/manifests/ data/multimodal-manifest.json
          git commit -m "chore(data): auto-update multimodal drive manifests [skip ci]" || echo "Không có thay đổi manifest mới"
          git pull --rebase origin main || echo "Rebase hoàn tất"
          git push || echo "Không thể push hoặc không có commit mới"
